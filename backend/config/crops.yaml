# Crop profiles — GENERIC FAO-56-STYLE PLACEHOLDER VALUES.
#
# These Kc curves, stage lengths, root depths, depletion fractions, and
# practical application limits are representative textbook values (FAO
# Irrigation and Drainage Paper 56, Annex 12 style), NOT calibrated for
# Uzbekistan varieties, climate, or agronomic practice. They MUST be
# validated against local field trials before being used to drive real
# irrigation decisions. Every number here is a starting point, not a fact.
#
# Stages: initial -> development -> mid_season -> late_season (standard
# FAO-56 growth staging), computed from planting_date + stage_lengths_days
# by app/domain/crop_stage.py. kc.initial/mid/end follow FAO-56 notation
# (Kc_ini, Kc_mid, Kc_end); Kc is held constant during initial and
# mid_season, and linearly interpolated during development (initial->mid)
# and late_season (mid->end). root_depth grows linearly from
# root_depth_initial_m to root_depth_max_m over the development stage, then
# holds at root_depth_max_m.
#
# depletion_fraction is FAO-56's "p" — the fraction of TAW assumed readily
# available (RAW = p * TAW) before the crop experiences water stress. FAO-56
# treats p as primarily crop-dependent (with an ETc-rate adjustment this MVP
# does not implement), so it lives here rather than on the soil profile.
#
# practical_application_mm.min/max bound the recommended irrigation depth to
# what is agronomically sensible for the crop regardless of the computed
# deficit (e.g. don't recommend 3mm — not worth an irrigation event — or
# 150mm — runoff/waterlogging risk).
#
# uncertainty_factor is on a 0.0-1.0 scale: 0.0 = a well-established,
# locally-validated value; 1.0 = a generic placeholder with no local
# validation at all. Every crop below is currently close to 1.0 because none
# of these values have been validated for Uzbekistan conditions yet — see
# docs/methodology.md. It feeds into the confidence engine's
# crop_profile_quality factor.

methodology_version: "0.2.0"

crops:
  cotton:
    label_uz: "G'o'za"
    stage_lengths_days:
      initial: 30
      development: 50
      mid: 55
      late: 45
    kc:
      initial: 0.35
      mid: 1.15
      end: 0.65
    root_depth_initial_m: 0.3
    root_depth_max_m: 1.2
    depletion_fraction: 0.55
    practical_application_mm:
      min: 15.0
      max: 90.0
    uncertainty_factor: 0.8

