# Crop profiles — GENERIC FAO-56-STYLE PLACEHOLDER VALUES.
#
# These Kc curves, stage lengths, and root depths are representative
# textbook values (FAO Irrigation and Drainage Paper 56, Annex 12 style),
# NOT calibrated for Uzbekistan varieties, climate, or agronomic practice.
# They MUST be validated against local field trials before being used to
# drive real irrigation decisions. Every number here is a starting point,
# not a fact.
#
# Stages: initial -> development -> mid -> late (standard FAO-56 growth
# staging). Kc values are linearly interpolated between stage midpoints by
# app/domain/crop_stage.py.

