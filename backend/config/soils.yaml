# Soil texture profiles — GENERIC PLACEHOLDER VALUES.
#
# field_capacity / wilting_point are volumetric water content fractions
# (m3/m3), representative textbook ranges for each texture class, NOT
# derived from Uzbekistan soil surveys. depletion_fraction is the FAO-56
# "p" default fraction of TAW assumed readily available before stress;
# actual p is also crop-dependent (see docs/methodology.md).
#
# "unknown" is a deliberately conservative middle-of-the-road profile used
# when a farmer has not specified soil texture — it lowers confidence
# rather than guessing a specific texture.

methodology_version: "0.1.0"

soils:
  sand:
    label_uz: "Qumloq"
    field_capacity: 0.12
    wilting_point: 0.05
    depletion_fraction: 0.55

  sandy_loam:
    label_uz: "Qumoq tuproq"
    field_capacity: 0.18
    wilting_point: 0.08
    depletion_fraction: 0.50

  loam:
    label_uz: "O'rtacha tuproq (qumoq-soz)"
    field_capacity: 0.28
    wilting_point: 0.14
    depletion_fraction: 0.50

  clay_loam:
    label_uz: "Og'ir qumoq-soz tuproq"
    field_capacity: 0.32
    wilting_point: 0.20
    depletion_fraction: 0.45

  clay:
    label_uz: "Soz tuproq"
    field_capacity: 0.38
    wilting_point: 0.24
    depletion_fraction: 0.40

  unknown:
    label_uz: "Noma'lum"
    field_capacity: 0.25
    wilting_point: 0.12
    depletion_fraction: 0.45
    requires_field_survey: true
