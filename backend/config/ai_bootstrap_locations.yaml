# Bootstrap sampling locations for the AI Soil Moisture Proxy v0.1 training
# dataset (backend/scripts/train_ai_soil_moisture.py).
#
# These are representative bootstrap coordinates used to create an open-data
# pre-calibration dataset. They are NOT field sensor observations and were
# NOT selected by any farmer-reported ground truth — they are approximate
# population centres of well-known agricultural districts, picked to spread
# coverage across Uzbekistan's climate/soil diversity (irrigated lowland
# cotton/wheat belt, Fergana valley, arid south, delta/desert-fringe west).
#
# `split` assigns each location to model TRAIN or held-out TEST use before
# any data is collected or any model is trained (CLAUDE.md rule 1: no
# randomness in this pipeline's decisions). Test locations are never seen
# during training, so reported metrics measure generalization to a new
# location, not memorization of a training location's seasonal pattern —
# see docs/methodology.md-style rationale in
# backend/scripts/train_ai_soil_moisture.py.
methodology_version: "0.1.0"

locations:
