[project]
name = "ai-irrigation-backend"
version = "0.1.0"
description = "Sensor-free irrigation decision-support backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
    "shapely>=2.0,<3.0",
    "pyproj>=3.6,<4.0",
    "email-validator>=2.2,<3.0",
    # xgboost>=3.0 required: the 2.x sklearn wrapper's save_model() is
    # incompatible with scikit-learn>=1.6's estimator-tag API
    # (`_estimator_type` TypeError).
    "xgboost>=3.0,<4.0",
    # Required by xgboost's sklearn-compatible XGBRegressor API (app/ai/model.py).
    "scikit-learn>=1.4,<2.0",
    # Upper-bounded below 2.2: numpy 2.2+ ships .pyi stubs using unconditional
    # PEP 695 `type` statements, which mypy cannot parse under this
    # project's `python_version = "3.11"` setting (see [tool.mypy]).
    "numpy>=1.26,<2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "respx>=0.21,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# Without this, `pip install .` silently drops app/ai/artifacts/**/*.json
# (setuptools only packages .py files by default) — the trained model
# artifact AISoilMoistureProxyModel.load() needs at runtime. Missing
# artifacts degrade gracefully to ai_summary.status="unavailable" rather
# than crashing (see app/ai/inference.py), but that would silently disable
# the AI evidence layer in every deployed environment that installs via
# `pip install .` (Docker/Render), not just locally where the source tree
# is used directly.
[tool.setuptools.package-data]
"app.ai" = ["artifacts/**/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern requires calling Depends()/Query()/
# Path() as argument defaults — this is the documented, idiomatic usage, not
# the mutable-default-argument bug B008 otherwise guards against.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
