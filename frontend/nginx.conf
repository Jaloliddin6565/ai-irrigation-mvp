server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router (BrowserRouter) owns client-side routing — any path
    # without a matching static file falls back to index.html so a direct
    # load or refresh on e.g. /fields/1/analysis works, not just "/".
    location / {
        try_files $uri $uri/ /index.html;
    }
}
