name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI always runs in fixture mode. No live provider credentials are ever
# referenced here — see CLAUDE.md.
env:
  DATA_MODE: fixture

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend package (with dev extras)
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Mypy type check
        run: python -m mypy app

      - name: Pytest
        run: python -m pytest -q

      - name: Determinism check - no randomness in domain/provider code
        run: |
          if grep -RInE "random\.|numpy\.random|uuid4\(\)|datetime\.now\(\)" app/domain app/providers --include="*.py"; then
            echo "Found disallowed non-deterministic call in domain/providers code. See CLAUDE.md."
            exit 1
          fi
