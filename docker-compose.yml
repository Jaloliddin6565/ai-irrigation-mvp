services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATA_MODE: fixture
      DATABASE_URL: sqlite:////data/ai_irrigation.db
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      LOG_LEVEL: INFO
    volumes:
      - backend-db:/data

  frontend:
    build:
      context: ./frontend
      # Vite bakes these into the static bundle at build time, so they must
      # be build args, not container-runtime environment variables. There is
      # no VITE_DATA_MODE — the frontend always reads the live data_mode
      # from the backend's own /health response (see docs/architecture.md
      # "Frontend"), never a static build-time flag.
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend-db:
